    <script>
      try {
        // R4.5b: check new disclaimer flag first; fall back to legacy
        // privacy-consent flag for backward-compat with existing installs.
        const newConsent = localStorage.getItem("disclaimer_acknowledged_v1");
        const legacyConsent = localStorage.getItem("fin-cockpit-privacy-consent-v1");
        const hasConsent = newConsent === "true"
          || legacyConsent === "accepted"
          || Boolean(JSON.parse(legacyConsent || "{}").accepted);
        const rawTheme = hasConsent ? localStorage.getItem("fin-cockpit-theme") : "";
        let savedTheme = "";
        try {
          savedTheme = JSON.parse(rawTheme || "\"\"");
        } catch (parseError) {
          savedTheme = rawTheme;
        }
        document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
