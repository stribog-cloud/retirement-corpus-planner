name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Mirror ci.yml's `lint` job so a tagged release cannot ship without
      # the same format/lint/static gates that gate every push to main.
      # Uses the npm script form (not `make static`), which is just
      # `node scripts/static-analysis.mjs` — `make static` additionally runs
      # `test:e2e:offline-load`, which needs a browser/build step that is
      # out of scope for this quick pre-build gate.
      - name: Format check
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Static analysis
        run: npm run static
      - name: Run unit tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary
      - name: Extract coverage percentage
        id: coverage
        # Mirror ci.yml's test-unit coverage-threshold enforcement (same
        # 96% floor from vite.config.js) so a release tag cannot be cut from
        # a commit that would fail the main-branch coverage gate. The
        # coverage-badge update step in ci.yml is intentionally not mirrored
        # here: it is guarded by `github.ref == 'refs/heads/main'`, which is
        # never true for a tag-triggered release run.
        run: |
          COVERAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./coverage/coverage-summary.json')).total.statements.pct)")
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=96
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build single-file HTML release
        run: npm run build
      # Release-hardening gates: verify the exact artifact about to be
      # published is byte/size-budget correct, passes the shipped-form smoke
      # checks, and loads no external network resource — before checksums
      # are cut and the GitHub Release is created below.
      - name: Artifact integrity check
        run: npm run artifact:check
      - name: Smoke test
        run: npm run test:smoke
      - name: Zero-network runtime gate
        run: npm run network:gate
      - name: Generate checksums
        run: |
          cd dist
          sha256sum app.html index.html > SHA256SUMS
          cd ..
          sha256sum "Retirement Corpus & Income Planner.html" >> dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/app.html
            dist/index.html
            Retirement Corpus & Income Planner.html
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
