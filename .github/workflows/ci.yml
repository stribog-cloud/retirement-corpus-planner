name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Static analysis
        run: npm run static

  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary
      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./coverage/coverage-summary.json')).total.statements.pct)")
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=96
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "percent=$COVERAGE" >> "$GITHUB_OUTPUT"
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 810e83e2fd273e360c77ffc7f12e886e
          filename: retirement-corpus-planner-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 50
          maxColorRange: 100

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build single-file HTML
        run: npm run build
      - name: Artifact integrity check
        run: npm run artifact:check
      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            index.html
            Retirement Corpus & Income Planner.html
          retention-days: 7

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Smoke test
        run: npm run test:smoke

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install fonts for consistent rendering
        # macOS audit baseline uses SF Pro / Helvetica family. Without these
        # on Ubuntu, Chromium falls back to DejaVu which has different metrics
        # — elements shift by a few pixels and break pixel-precise tour /
        # spotlight assertions. Liberation Sans is the open-source Helvetica
        # metric-compatible clone; Noto covers Unicode + emoji; DejaVu is the
        # broad fallback.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            fonts-liberation2 \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-noto-mono \
            fonts-dejavu-core \
            fonts-lato
          fc-cache -fv >/dev/null
      - name: Install Chrome for Puppeteer
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Run E2E suite
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e

  charter-docs:
    name: Charter Docs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Charter docs test
        run: npm run test:charter-docs

  vulnerability:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high+)
        run: npm run vulnerability

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml -v

  trailer-check:
    name: Trailer Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # By default on pull_request events, actions/checkout checks out a
          # synthetic merge ref (refs/pull/N/merge) whose HEAD is a merge
          # commit GitHub auto-generates. That commit has no Co-authored-by
          # trailer (no human ever wrote it), so trailer-check would always
          # fail on PRs. Checkout the actual PR head commit instead.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch base branch (so origin/<base_ref> resolves)
        run: git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
      - name: Verify Co-authored-by trailers on PR commits
        # HEAD is now the PR head commit (not a merge ref). The range
        # origin/<base_ref>..HEAD is exactly the PR's commits.
        run: node scripts/precommit-trailer-check.mjs --range "origin/${{ github.base_ref }}..HEAD"
